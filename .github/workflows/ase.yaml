name: ASE Docker Build Workflow

on:
  schedule:
    - cron: '0 0 1 * *'
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'イメージのタグ (未指定の場合は日付ベース)'
        required: false
        type: string

jobs:
  build-ase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate date-based tag
        id: date-tag
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "tag=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "tag=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Generate lowercase repository name
        id: repo-name
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$REPO_OWNER" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ase
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.repo-name.outputs.owner }}/ase:${{ steps.date-tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}